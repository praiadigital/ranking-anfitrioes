<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ranking de Anfitriões — suba de nível no litoral</title>
<meta name="description" content="Gamificação para anfitriões do litoral: calcule seu nível, conquiste badges e entre no ranking. Satélite da rede praia.digital">
<style>
body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(180deg,#1e1b4b,#312e81);color:#e0e7ff;min-height:100vh}
header{padding:24px;text-align:center}
nav a{color:#fbbf24;margin:0 8px;text-decoration:none;font-size:14px}
.wrap{max-width:700px;margin:auto;padding:0 20px 30px}
.panel{background:rgba(255,255,255,.08);backdrop-filter:blur(8px);border-radius:16px;padding:22px;margin-bottom:16px;border:1px solid rgba(255,255,255,.15)}
label{display:block;margin:10px 0 4px;font-weight:600;font-size:14px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.25);color:#fff;font-size:16px}
.nivel{text-align:center;font-size:22px}
.nivel b{font-size:40px;display:block;color:#fbbf24}
.xp{background:rgba(0,0,0,.3);border-radius:99px;height:16px;overflow:hidden;margin:12px 0}
.xp div{height:100%;background:linear-gradient(90deg,#fbbf24,#f97316);transition:width .5s}
.badges{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.badge{background:rgba(0,0,0,.3);border-radius:14px;padding:14px;text-align:center;width:100px;opacity:.35;transition:.3s}
.badge.on{opacity:1;border:1px solid #fbbf24;transform:scale(1.05)}
.badge span{font-size:32px;display:block}
.badge small{font-size:11px}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:9px;border-bottom:1px solid rgba(255,255,255,.1);text-align:left}
footer{padding:20px;text-align:center;font-size:13px;color:#a5b4fc}
footer a{color:#fbbf24}
</style></head>
<body>
<header><h1>🏆 Ranking de Anfitriões</h1><p>Qual é o seu nível de anfitrião no litoral?</p>
<nav><a href="https://praia.digital">Praia Digital</a><a href="https://praia.digital/area-anfitriao">Área do Anfitrião</a><a href="https://praia.digital/marea">Maréa</a><a href="https://praia.digital/apps">Todos os apps</a></nav></header>
<div class="wrap">
<div class="panel"><h2>📊 Seus números</h2>
<label>Reservas concluídas</label><input type="number" id="res" value="12" oninput="calc()">
<label>Avaliação média (1-5)</label><input type="number" id="nota" value="4.7" step="0.1" oninput="calc()">
<label>Taxa de resposta rápida (%)</label><input type="number" id="resp" value="85" oninput="calc()">
<label>Meses como anfitrião</label><input type="number" id="meses" value="10" oninput="calc()"></div>
<div class="panel nivel"><p>Seu nível</p><b id="nivel">—</b><p id="xpTxt"></p><div class="xp"><div id="xpBar"></div></div></div>
<div class="panel"><h2>🎖️ Suas conquistas</h2><div class="badges" id="badges"></div></div>
<div class="panel"><h2>🌊 Top do litoral (demo)</h2><table id="top"></table></div>
</div>
<footer>Rede <a href="https://praia.digital">praia.digital</a> · <a href="https://praia.digital/fluxo-caixa">Fluxo de Caixa</a> · <a href="https://praia.digital/whatsapp-kit">WhatsApp Kit</a> · <a href="https://praia.digital/eco-praia">Eco Praia</a></footer>
<script>
const niveis=[[0,'🐚 Conchinha'],[100,'🏖️ Guarda-Sol'],[300,'🌊 Surfista'],[600,'⛵ Capitão'],[1000,'🐋 Lenda do Litoral']];
const badgesDefs=[[10,'res','🎯','10+ reservas'],[50,'res','💎','50+ reservas'],[4.8,'nota','⭐','Super avaliado'],[90,'resp','⚡','Raio nas respostas'],[12,'meses','📅','1 ano de estrada'],[24,'meses','🧭','Veterano']];
function calc(){
const r=+res.value,n=+nota.value,rp=+resp.value,m=+meses.value;
const xp=Math.round(r*10+n*20+rp*0.5+m*5);
let ni=0;niveis.forEach((l,i)=>{if(xp>=l[0])ni=i;});
const prox=niveis[ni+1];
nivel.textContent=niveis[ni][1];
xpTxt.textContent=prox?`${xp} XP · faltam ${prox[0]-xp} para ${prox[1]}`:`${xp} XP · nível máximo! 👑`;
xpBar.style.width=(prox?Math.min(100,(xp-niveis[ni][0])/(prox[0]-niveis[ni][0])*100):100)+'%';
badges.innerHTML=badgesDefs.map(b=>{const val={res:r,nota:n,resp:rp,meses:m}[b[1]];return `<div class="badge ${val>=b[0]?'on':''}"><span>${b[2]}</span><small>${b[3]}</small></div>`}).join('');}
top.innerHTML='<tr><th>#</th><th>Anfitrião</th><th>Cidade</th><th>XP</th></tr>'+[['Você','—','—'],['Marina S.','Santos',1820],['Carlos G.','Guarujá',1450],['Pousada Brisa','São Sebastião',1210],['Aptos PG Prime','Praia Grande',980]].map((r,i)=>i===0?`<tr style="color:#fbbf24"><td>?</td><td><b>Você</b></td><td>—</td><td>?</td></tr>`:`<tr><td>${i}</td><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td>`).join('');
calc();
</script></body></html>
