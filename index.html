<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Ranking de Anfitriões — Praia Digital</title><meta name="description" content="Gamificação e badges para anfitriões do litoral: descubra seu nível de anfitrião."><link rel="canonical" href="https://praia.digital/ranking-anfitrioes/"><style>body{font-family:system-ui,sans-serif;margin:0;background:#0b1220;color:#e8ecf1}main{max-width:760px;margin:auto;padding:24px}input{width:100%;padding:10px;border-radius:8px;background:#0f172a;color:#e8ecf1;border:1px solid #243348;margin:4px 0 12px;box-sizing:border-box}.panel{background:#121c2e;border:1px solid #243348;border-radius:14px;padding:20px;margin-bottom:14px}.badge{font-size:56px}.btn{display:inline-block;padding:10px 16px;border-radius:10px;background:#1f6feb;color:#fff;text-decoration:none;font-weight:600;border:0;cursor:pointer}</style></head><body><nav style="background:#0a2540;padding:14px 20px"><span style="color:#fff;font-weight:700;margin-right:16px">🌊 Praia Digital</span><a href="https://praia.digital/apps/" style="color:#9fd8ff;margin-right:12px">Apps</a><a href="https://praia.digital/area-anfitriao/" style="color:#9fd8ff;margin-right:12px">Área do Anfitrião</a><a href="https://praia.digital/checklist-anfitriao/" style="color:#9fd8ff">Checklist Anfitrião</a></nav><main><h1>🏆 Ranking de Anfitriões</h1><p>Descubra seu nível de anfitrião e o que falta para o próximo badge.</p><div class="panel"><label>Avaliação média (1–5)</label><input id="a" type="number" step="0.1" value="4.8"><label>Reservas concluídas</label><input id="r" type="number" value="25"><label>Taxa de resposta (%)</label><input id="t" type="number" value="95"><label>Tempo médio de resposta (min)</label><input id="m" type="number" value="30"><button class="btn" onclick="go()">Ver meu nível</button></div><div class="panel" id="res" style="display:none;text-align:center"><div class="badge" id="bd"></div><h2 id="nv"></h2><p id="dt"></p><a class="btn" href="https://praia.digital/preco-justo/">Melhorar minha diária</a></div></main><script>function go(){const a=+document.getElementById('a').value,r=+document.getElementById('r').value,t=+document.getElementById('t').value,m=+document.getElementById('m').value;const s=a*20+Math.min(30,r)+t*0.3+Math.max(0,20-m*0.2);document.getElementById('res').style.display='block';let b,n,d;if(s>=140){b='💎';n='Anfitrião Diamante';d='Elite do litoral! Seus anúncios merecem destaque premium.'}else if(s>=110){b='🥇';n='Anfitrião Ouro';d='Quase lá! Melhore o tempo de resposta para chegar ao Diamante.'}else if(s>=80){b='🥈';n='Anfitrião Prata';d='Bom desempenho — foque em mais avaliações 5 estrelas.'}else{b='🥉';n='Anfitrião Bronze';d='Comece pelo Checklist do Anfitrião para subir de nível.'}document.getElementById('bd').textContent=b;document.getElementById('nv').textContent=n;document.getElementById('dt').textContent='Score: '+Math.round(s)+' — '+d;}</script></body></html>
